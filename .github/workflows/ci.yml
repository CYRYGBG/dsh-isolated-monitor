name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test test/*.test.mjs
      - name: Bundle shape
        run: node scripts/check-publish-ready.mjs
      - name: Market index is current
        run: node scripts/make-market-index.mjs --check
